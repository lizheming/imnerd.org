name: Say page
on:
  pull_request:
    paths:
      - 'themes/eureka/**'
      - 'widgets/**'
      - 'tests/says*'
      - 'package.json'
      - '.github/workflows/says.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/says.test.js tests/says-dom.test.js
      - run: npm run build
